<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Export Company</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <meta name="description" content="Brazilian Export Company">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      scroll-behavior: smooth;
    }

    header {
      position: fixed;
      width: 100%;
      background: #111;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
    }

    section {
      padding: 80px 20px;
      opacity: 0;
      transform: translateY(20px);
      transition: 0.6s;
    }

    section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hero {
      height: 100vh;
      background: url('https://via.placeholder.com/1920x1080') center/cover;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 15px;
    }

    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .lang-switch button {
      margin-left: 5px;
    }

    .whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: green;
      color: white;
      padding: 10px;
      border-radius: 50%;
    }
  </style>
</head>

<body>

  <header>
    <div>LOGO</div>
    <div class="lang-switch">
      <button onclick="setLang('pt')">PT</button>
      <button onclick="setLang('en')">EN</button>
      <button onclick="setLang('es')">ES</button>
    </div>
  </header>

  <section class="hero">
    <div>
      <h1 data-key="hero_title">Título</h1>
      <p data-key="hero_sub">Subtítulo</p>
    </div>
  </section>

  <section>
    <h2 data-key="about_title">Sobre</h2>
    <p data-key="about_text">Texto</p>
  </section>

  <section>
    <h2 data-key="products_title">Produtos</h2>
    <div class="products">
      <div class="card">
        <img src="https://via.placeholder.com/300">
        <h3 data-key="product1">Produto</h3>
      </div>
    </div>
  </section>

  <section>
    <h2 data-key="shipping_title">Shipping</h2>
    <p data-key="shipping_text">Texto</p>
  </section>

  <section>
    <h2 data-key="contact_title">Contato</h2>
    <p>Email: contato@email.com</p>
    <p>WhatsApp: +55 00 00000-0000</p>
  </section>

  <footer>
    <p>Site estático com dados fixos a partir de R$ x,xx</p>
    <p>Site com edição via painel administrativo a partir de R$ x,xx</p>
  </footer>

  <a class="whatsapp" href="#">WA</a>

  <script>
    const translations = {
      pt: {
        hero_title: "Exportadora Brasileira",
        hero_sub: "Qualidade global",
        about_title: "Nossa História",
        about_text: "Descrição da empresa",
        products_title: "Produtos",
        product1: "Produto exemplo",
        shipping_title: "Envio Internacional",
        shipping_text: "Detalhes logísticos",
        contact_title: "Contato"
      },
      en: {
        hero_title: "Brazilian Export Company",
        hero_sub: "Global Quality",
        about_title: "Our Story",
        about_text: "Company description",
        products_title: "Products",
        product1: "Sample product",
        shipping_title: "Global Shipping",
        shipping_text: "Logistics details",
        contact_title: "Contact"
      },
      es: {
        hero_title: "Empresa Exportadora Brasileña",
        hero_sub: "Calidad Global",
        about_title: "Nuestra Historia",
        about_text: "Descripción de la empresa",
        products_title: "Productos",
        product1: "Producto ejemplo",
        shipping_title: "Envío Internacional",
        shipping_text: "Detalles logísticos",
        contact_title: "Contacto"
      }
    };

    function setLang(lang) {
      document.querySelectorAll("[data-key]").forEach(el => {
        el.innerText = translations[lang][el.dataset.key];
      });
    }

    // animação ao scroll
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        }
      });
    });

    document.querySelectorAll("section").forEach(sec => observer.observe(sec));
  </script>

</body>

</html>
